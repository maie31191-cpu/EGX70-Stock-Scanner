name: Run EGX Stock Scanner V2

on:
  schedule:
    # يعمل تلقائياً أيام الأحد حتى الخميس الساعة 4:00 عصراً بتوقيت القاهرة
    - cron: '0 14 * * 0-4'
  workflow_dispatch: # يتيح التشغيل اليدوي بضغطة زر

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: Run Stock Scanner V2
        run: |
          python scanner_v2.py
